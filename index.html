<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oppdragsoversikt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Oppdragsoversikt</h1>
  <div class="source-badge" id="sourceBadge">Kilde: mock-data</div>
</header>

<main>
  <section class="controls">
    <input type="search" id="searchInput" placeholder="Søk på oppdrag, kunde eller ansvarlig...">

    <select id="statusFilter">
      <option value="alle">Alle statuser</option>
      <option value="aktiv">Aktiv</option>
      <option value="pauset">Pauset</option>
      <option value="avsluttet">Avsluttet</option>
    </select>

    <select id="ansvarligFilter">
      <option value="alle">Alle ansvarlige</option>
    </select>

    <button id="refreshBtn" type="button">Oppdater</button>
  </section>

  <section class="stats" id="statsRow"></section>

  <section class="table-wrap">
    <table id="oppdragTable">
      <thead>
        <tr>
          <th data-sort="tittel">Oppdrag</th>
          <th data-sort="kunde">Kunde</th>
          <th data-sort="ansvarlig">Ansvarlig</th>
          <th data-sort="status">Status</th>
          <th data-sort="antallKandidater">Kandidater</th>
          <th data-sort="frist">Frist</th>
        </tr>
      </thead>
      <tbody id="oppdragBody"></tbody>
    </table>
    <p id="emptyState" class="empty-state" hidden>Ingen oppdrag matcher søket/filteret.</p>
  </section>
</main>

<script src="data/mock-oppdrag.js"></script>
<script src="recman-adapter.js"></script>
<script src="app.js"></script>
</body>
</html>
