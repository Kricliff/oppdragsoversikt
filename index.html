<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oppdragsoversikt</title>
<link rel="icon" href="assets/gp-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="board">

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" id="brandLogo" src="assets/great-people-black-logo.png" alt="GreatPeople">
    </div>

    <div class="stats" id="statsRow"></div>

    <div class="clock-block">
      <div class="vaer" id="vaerWidget">
        <div class="vaer-rad">
          <span class="vaer-ikon" id="vaerIkon">⛅</span>
          <span class="vaer-temp" id="vaerTemp">--°</span>
        </div>
        <span class="vaer-varsel" id="vaerVarsel" hidden>☂️ Ta med paraply</span>
      </div>
      <div class="clock-tid">
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="dateLabel">-</div>
      </div>
    </div>
  </header>
  <div class="brand-bar"></div>

  <main id="lanes" class="lanes"></main>

  <footer class="statusbar">
    <span id="sourceBadge" class="source-badge">Kilde: mock-data</span>
    <span class="dot">•</span>
    <span id="updatedLabel">Sist oppdatert: -</span>
    <div class="statusbar-actions">
      <button id="temaBtn" type="button" title="Bytt tema" aria-label="Bytt mørkt/lyst tema">🌙</button>
      <button id="refreshBtn" type="button" title="Oppdater nå" aria-label="Oppdater nå">⟳</button>
    </div>
  </footer>

  <p id="emptyState" class="empty-state" hidden>Ingen aktive oppdrag akkurat nå.</p>

  <button id="gjesteKnapp" class="gjeste-knapp" type="button" title="Gjestevisning (Ctrl+Shift+G)" aria-label="Vis gjestevisning">🙈</button>

  <div class="postit">
    <div class="postit-pin">📌</div>
    <textarea id="notatTekst" class="postit-text" maxlength="500" placeholder="Ingen beskjed satt" readonly></textarea>
  </div>

  <div class="busstider">
    <div class="busstider-header" id="busstiderHeader">🚌 Wessels plass</div>
    <div class="busstider-liste" id="busstiderListe"></div>
  </div>

  <div class="kundenytt" id="kundenyttPanel" hidden>
    <div class="kundenytt-header" id="kundenyttHeader">📣 Kundenytt</div>
    <div class="kundenytt-liste" id="kundenyttListe"></div>
  </div>

  <div class="feiring" id="feiringBanner" hidden>
    <div class="feiring-track" id="feiringTrack">
      <span class="feiring-tekst" id="feiringTekst1"></span>
      <span class="feiring-tekst" id="feiringTekst2" aria-hidden="true"></span>
    </div>
  </div>

  <div class="bursdag-banner" id="bursdagBanner" hidden>
    <div class="bursdag-banner-track" id="bursdagBannerTrack">
      <span class="bursdag-banner-tekst" id="bursdagBannerTekst1"></span>
      <span class="bursdag-banner-tekst" id="bursdagBannerTekst2" aria-hidden="true"></span>
    </div>
  </div>

</div>

<!-- Gjestevisning - full-skjerm erstatning som skjuler kandidat-/kundenavn når det
     kommer besøk. Aktiveres med Ctrl+Shift+G, se veksleGjestevisning i app.js. -->
<div class="gjestevisning" id="gjestevisning" hidden>
  <img class="gjeste-logo" src="assets/great-people-black-logo.png" alt="GreatPeople">
  <p class="gjeste-tittel">Slik går det med oss</p>

  <div class="gjeste-stats" id="gjesteStats"></div>

  <div class="gjeste-grafer">
    <div class="gjeste-graf-kort">
      <h3>Kandidater landet per måned</h3>
      <div class="gjeste-graf" id="gjesteGrafKandidater"></div>
    </div>
    <div class="gjeste-graf-kort">
      <h3>Oppdrag fullført per måned</h3>
      <div class="gjeste-graf" id="gjesteGrafOppdrag"></div>
    </div>
  </div>

  <div class="gjeste-trender-kort">
    <h3>Rekrutteringstrender</h3>
    <div class="gjeste-trender-liste" id="gjesteTrenderListe"></div>
  </div>
</div>

<script src="data/mock-oppdrag.js"></script>
<script src="recman-adapter.js"></script>
<script src="busstider.js"></script>
<script src="telling.js"></script>
<script src="vaer.js"></script>
<script src="feiring.js"></script>
<script src="nrk.js"></script>
<script src="kundenytt.js"></script>
<script src="bursdager.js"></script>
<script src="app.js"></script>
</body>
</html>
