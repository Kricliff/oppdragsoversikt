<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oppdragsoversikt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="board">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <h1>Oppdragsoversikt</h1>
    </div>

    <div class="stats" id="statsRow"></div>

    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="dateLabel">-</div>
    </div>
  </header>

  <main id="lanes" class="lanes"></main>

  <footer class="statusbar">
    <span id="sourceBadge" class="source-badge">Kilde: mock-data</span>
    <span class="dot">•</span>
    <span id="updatedLabel">Sist oppdatert: -</span>
    <button id="refreshBtn" type="button" title="Oppdater nå" aria-label="Oppdater nå">⟳</button>
  </footer>

  <p id="emptyState" class="empty-state" hidden>Ingen aktive oppdrag akkurat nå.</p>

</div>

<script src="data/mock-oppdrag.js"></script>
<script src="recman-adapter.js"></script>
<script src="app.js"></script>
</body>
</html>
