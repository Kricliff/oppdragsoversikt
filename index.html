<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oppdragsoversikt</title>
<link rel="icon" href="assets/gp-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="board">

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/great-people-black-logo.png" alt="GreatPeople">
      <span class="brand-divider"></span>
      <h1>Oppdragsoversikt</h1>
    </div>

    <div class="stats" id="statsRow"></div>

    <div class="clock-block">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="dateLabel">-</div>
    </div>
  </header>
  <div class="brand-bar"></div>

  <main id="lanes" class="lanes"></main>

  <footer class="statusbar">
    <span id="sourceBadge" class="source-badge">Kilde: mock-data</span>
    <span class="dot">•</span>
    <span id="updatedLabel">Sist oppdatert: -</span>
    <button id="refreshBtn" type="button" title="Oppdater nå" aria-label="Oppdater nå">⟳</button>
  </footer>

  <p id="emptyState" class="empty-state" hidden>Ingen aktive oppdrag akkurat nå.</p>

  <div class="postit">
    <div class="postit-pin">📌</div>
    <textarea id="notatTekst" class="postit-text" maxlength="500" placeholder="Skriv en beskjed til teamet…"></textarea>
  </div>

  <div class="busstider">
    <div class="busstider-header" id="busstiderHeader">🚌 Wessels plass</div>
    <div class="busstider-liste" id="busstiderListe"></div>
  </div>

</div>

<script src="data/mock-oppdrag.js"></script>
<script src="recman-adapter.js"></script>
<script src="busstider.js"></script>
<script src="app.js"></script>
</body>
</html>
